name: Validate RaceDay Docs

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

jobs:
  check-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Docs Folder Exists
        run: |
          if [ -d "docs" ]; then
            echo "docs folder exists."
          else
            echo "Error: /docs folder is missing!"
            exit 1
          fi

      - name: Verify Required Files Present
        run: |
          cd docs
          # Check for ERD image, endpoint plan, and SQL script (adjust extensions if needed)
          ls -la
          if ls erd-diagram.* 1> /dev/null 2>&1 && ls *.md 1> /dev/null 2>&1 && ls *.sql 1> /dev/null 2>&1; then
            echo "All required document types appear to be present."
          else
            echo "Warning: Ensure your ERD image, markdown/PDF endpoint plan, and SQL script are inside the /docs folder."
          fi
